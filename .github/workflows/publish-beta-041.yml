name: Publish AutoBot 0.4.1 beta (one-time)
on:
  push:
    paths:
      - .github/workflows/publish-beta-041.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified beta from build artifact
        env:
          SOURCE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-dcf4-820a-8cd3-164403d5b070/raw?se=2026-10-27T16%3A35%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=44fe8f56-eda9-512a-83f7-a401ca964aca&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T10%3A37%3A13Z&ske=2026-10-28T10%3A37%3A13Z&sks=b&skv=2026-02-06&sig=vbjsTYZdJLa0%2Bcx4GI7%2BKMpCs8Fay6OfcFkTJCB/s5c%3D"
        run: |
          mkdir -p releases
          curl --fail --show-error --location --retry 2 --max-time 55 --output /tmp/autobot-beta.zip "$SOURCE_URL"
          unzip -p /tmp/autobot-beta.zip minecraft-autobot-0.4.1.jar > releases/Minecraft-AutoBot-1.21.11-v0.4.1.jar
          echo "48a66cf6a33fcd42be7193de97c06e6892189433578bed209b9d1569e3ea5bfd  releases/Minecraft-AutoBot-1.21.11-v0.4.1.jar" | sha256sum -c -
          test "$(stat -c%s releases/Minecraft-AutoBot-1.21.11-v0.4.1.jar)" -eq 84408
          unzip -p releases/Minecraft-AutoBot-1.21.11-v0.4.1.jar fabric.mod.json | grep -F '"version": "0.4.1"'
      - name: Update public manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("releases/Minecraft-AutoBot-1.21.11-v0.4.1.jar")
          manifest = {
              "schema": 1,
              "modId": "minecraftautobot",
              "minecraft": "1.21.11",
              "version": "0.4.1",
              "url": "https://raw.githubusercontent.com/kasyniarz123124235/Minecraft-AutoBot-Updates/main/" + str(p),
              "sha256": "48a66cf6a33fcd42be7193de97c06e6892189433578bed209b9d1569e3ea5bfd",
              "size": p.stat().st_size,
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          PY
      - name: Publish JAR and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json releases/Minecraft-AutoBot-1.21.11-v0.4.1.jar
          git commit -m "Release AutoBot v0.4.1 beta for automatic updater"
          git push
